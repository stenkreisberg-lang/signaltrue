name: Repair SEO PR quality blockers

on:
  push:
    branches:
      - seo/australia-discoverability

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seo/australia-discoverability
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format frontend source
        run: npx prettier --write "src/**/*.{js,jsx,ts,tsx,json,css,md}"
      - name: Refresh vulnerable dependency resolutions
        run: npm audit fix --package-lock-only
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package-lock.json
          git commit -m "Fix formatting and dependency audit blockers"
          git push origin HEAD:seo/australia-discoverability
