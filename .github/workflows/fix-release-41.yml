name: Fix SignalTrue release checks
on:
  push:
    branches: [feature/top-findings-history-20261015]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/top-findings-history-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format frontend
        run: npx prettier --write src/components/CustomerBand.tsx src/components/SampleReportSection.tsx src/pages/app/LatestBrief.js
      - name: Resolve frontend dependency vulnerabilities without forced major upgrade
        run: |
          npm pkg set 'overrides.braces=^3.0.3'
          npm pkg set 'overrides.source-map-js=^1.2.2'
          npm pkg set 'overrides.postcss-selector-parser=^7.1.6'
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/CustomerBand.tsx src/components/SampleReportSection.tsx src/pages/app/LatestBrief.js
          git diff --cached --quiet || git commit -m "fix: format dashboard and resolve dependency audit"
          git push origin HEAD:feature/top-findings-history-20261015
