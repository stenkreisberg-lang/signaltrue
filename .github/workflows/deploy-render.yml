name: Deploy to Render (backend)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install backend deps
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Run backend tests
        run: npm --prefix backend test

      - name: Deploy to Render through API
        if: ${{ env.RENDER_SERVICE_ID != '' && env.RENDER_API_KEY != '' }}
        run: |
          curl --fail-with-body -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

      - name: Verify deployed commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          HEALTH_URL: https://signaltrue-backend.onrender.com/api/health/ready
        run: |
          for attempt in {1..36}; do
            response="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"
            deployed_commit="$(jq -r '.version // empty' <<<"$response")"

            if [[ "$deployed_commit" == "$EXPECTED_COMMIT" ]]; then
              echo "Render is serving commit $EXPECTED_COMMIT"
              exit 0
            fi

            echo "Waiting for Render deployment ($attempt/36)"
            sleep 10
          done

          echo "Render did not serve commit $EXPECTED_COMMIT within six minutes"
          exit 1
