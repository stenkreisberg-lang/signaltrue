name: Daily onboarding reminders

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deduplicated reminder check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            https://signaltrue-backend.onrender.com/api/reminders/check-followups
