name: Auto-format frontend
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/signaltrue-integrity-2026-10-31']
    paths:
      - '.github/workflows/format-fix.yml'
      - 'src/components/app/ReportTrendExplorer.jsx'
      - 'src/pages/app/LatestBrief.js'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: |
          git config user.name "signaltrue-format"
          git config user.email "format@signaltrue.ai"
          git add src
          git commit -m "chore: format product changes [skip ci]" || true
          git push