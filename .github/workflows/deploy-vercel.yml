name: Deploy to Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'marketing/**'
      - 'tools/generate-sitemap.mjs'
      - 'tools/write-build-version.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'craco.config.js'
      - 'vercel.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --if-present

      - name: Check Vercel credentials
        id: vercel_credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel action credentials are absent; relying on the native Git deployment."
          fi

      - name: Deploy to Vercel
        if: ${{ steps.vercel_credentials.outputs.available == 'true' }}
        # Requires the following repo secrets to be set:
        # VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Verify deployed frontend
        env:
          VERSION_URL: https://www.signaltrue.ai/build-version.json
        run: |
          for attempt in {1..40}; do
            response="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "$VERSION_URL?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            deployed_commit="$(jq -r '.commit // empty' <<<"$response" 2>/dev/null || true)"

            if [[ "$deployed_commit" == "$GITHUB_SHA" ]]; then
              echo "Vercel is serving commit $GITHUB_SHA"
              exit 0
            fi

            echo "Waiting for Vercel deployment ($attempt/40; currently ${deployed_commit:-unavailable})"
            sleep 15
          done

          echo "Vercel did not serve commit $GITHUB_SHA within ten minutes"
          exit 1
