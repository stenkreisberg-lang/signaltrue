name: Format Priority 2 review branch
on:
  push:
    branches:
      - fix/priority2-3-data-reliability-20261110
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/app/SignalCoverage.js src/pages/PrivacyPolicy.tsx
      - run: |
          git config user.name "signaltrue-format"
          git config user.email "format@signaltrue.ai"
          git add src/pages/app/SignalCoverage.js src/pages/PrivacyPolicy.tsx
          git diff --cached --quiet || git commit -m "chore: format priority2 UI [skip ci]"
          git push
