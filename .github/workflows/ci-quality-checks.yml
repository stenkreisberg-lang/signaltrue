name: Quality gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend quality and browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests and coverage thresholds
        run: npm run test:coverage
      - name: Build production assets
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8081
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flow tests
        run: npm run test:e2e

  backend:
    name: Backend quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm --prefix backend ci --no-audit --no-fund
      - name: Lint
        run: npm --prefix backend run lint
      - name: Tests and coverage thresholds
        run: npm --prefix backend run test:coverage -- --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install lockfiles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high
      - name: Run Snyk security scan when configured
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          command: test
          args: --all-projects --severity-threshold=high
