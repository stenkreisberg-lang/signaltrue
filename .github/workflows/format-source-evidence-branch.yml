name: Format source evidence branch
on:
  push:
    branches:
      - fix/tehnopol-evidence-and-hr-ux-20261111
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/app/SignalCoverage.js
      - name: Commit formatting
        run: |
          git config user.name "signaltrue-format"
          git config user.email "format@signaltrue.ai"
          git add src/pages/app/SignalCoverage.js
          git diff --cached --quiet || git commit -m "chore: format source evidence UI [skip ci]"
          git push
