name: Temporary Tehnopol PR Formatter
on:
  push:
    branches:
      - fix/tehnopol-verified-evidence-final-2026-11-05
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/app/Overview.js
      - name: Commit precise formatting
        run: |
          git config user.name signaltrue-quality
          git config user.email qa@signaltrue.ai
          git add src/pages/app/Overview.js
          git commit -m "style: apply Prettier to overview availability changes" || true
          git push
