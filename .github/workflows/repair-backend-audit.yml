name: Repair backend dependency audit

on:
  push:
    branches:
      - seo/australia-discoverability

permissions:
  contents: write

jobs:
  repair-backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seo/australia-discoverability
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh backend dependencies
        working-directory: backend
        run: |
          npm install nodemailer@^10.0.13 axios@^1.20.0 --save --package-lock-only
          npm audit fix --package-lock-only
      - name: Verify backend audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Commit generated backend dependency fixes
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "Fix backend dependency audit blockers"
          git push origin HEAD:seo/australia-discoverability
