name: One-time manager dashboard formatting
on:
  push:
    branches:
      - fix/tehnopol-manager-attribution-smallteam-trends-20261111
    paths:
      - .github/workflows/one-time-manager-prettier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/tehnopol-manager-attribution-smallteam-trends-20261111
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply existing Prettier configuration
        run: npx prettier --write src/pages/app/ManagerTeamDashboard.jsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/pages/app/ManagerTeamDashboard.jsx; then
            git add src/pages/app/ManagerTeamDashboard.jsx
            git commit -m "format: apply Prettier to manager trend dashboard"
            git push origin HEAD:refs/heads/fix/tehnopol-manager-attribution-smallteam-trends-20261111
          fi
