<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
<title id="title">Fictional before and after meeting hours, after-hours activity and focus time</title>
<desc id="desc">Meeting hours per person per week: 11.2, 7.4, 7.8. Days with after-hours activity: 18 percent, 25 percent, 23 percent. Focus hours per person per week: 4.6, 6.2, 5.8.</desc>
<rect width="1200" height="485" rx="22" fill="#f5faf7"/>
<text x="42" y="49" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#15392c">Did demand fall, or move?</text>
<text x="42" y="78" font-family="Arial, sans-serif" font-size="16" fill="#506c5d">Invented team-level figures. Three points in time, not a customer result.</text>
<g stroke="#d2ddd6" stroke-width="1"><line x1="40" y1="401" x2="1160" y2="401"/></g>
<g font-family="Arial, sans-serif">
<rect x="40" y="108" width="346" height="310" rx="14" fill="#fff" stroke="#d7e9dd"/>
<rect x="426" y="108" width="346" height="310" rx="14" fill="#fff" stroke="#d7e9dd"/>
<rect x="812" y="108" width="346" height="310" rx="14" fill="#fff" stroke="#d7e9dd"/>
<g fill="#254638" font-size="17" font-weight="700"><text x="59" y="143">Meeting hours / person / week</text><text x="445" y="143">After-hours team workdays</text><text x="831" y="143">Focus hours / person / week</text></g>
