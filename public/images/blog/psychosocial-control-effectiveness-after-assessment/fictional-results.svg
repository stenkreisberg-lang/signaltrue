<g fill="#133c2b" font-size="18" font-weight="700" text-anchor="middle"><text x="114" y="185">11.2h</text><text x="211" y="240">7.4h</text><text x="308" y="234">7.8h</text><text x="500" y="249">18%</text><text x="597" y="210">25%</text><text x="694" y="221">23%</text><text x="886" y="252">4.6h</text><text x="983" y="218">6.2h</text><text x="1080" y="226">5.8h</text></g>
