# Render Blueprint for SignalTrue Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: signaltrue-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    # backend/package.json pins the supported Node runtime range.
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MS_APP_CLIENT_ID
        sync: false
      - key: MS_APP_CLIENT_SECRET
        sync: false
      - key: MS_APP_REDIRECT_URI
        sync: false
      - key: MS_APP_TENANT
        sync: false
      # Optional integrations (set values in Render Dashboard after deploy)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: '587'
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      # Engagement Strain email digest (SMTP — optional, no-op if unset)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # LLM explanations (uses OPENAI_API_KEY above — OPENAI_MODEL defaults to gpt-4o-mini)
      - key: OPENAI_MODEL
        value: 'gpt-4o-mini'
      - key: API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: REPORT_TRIGGER_SECRET
        sync: false
      - key: SITE_ANALYTICS_REPORT_EMAIL
        value: sten.kreisberg@gmail.com
      - key: SITE_ANALYTICS_FROM_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
